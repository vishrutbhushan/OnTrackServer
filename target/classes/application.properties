# OnTrack Server Configuration

# Application Info
spring.application.name=ontrack-server
server.port=8080
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ontrack
spring.datasource.username=db_user
spring.datasource.password=Root@Password@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Google Cloud Configuration
google.cloud.project-id=ontrack-udt
spring.cloud.gcp.credentials.location=classpath:service-account-key.json

# Gemini AI Configuration
gemini.api.key=AIzaSyDYHHrVu2bn1VbTJiqK6LAklWmaqiEIJtw

# Email Processing Configuration
email.processing.schedule.enabled=true
email.processing.schedule.interval=1

# Logging Configuration
logging.level.com.project.onTrackServer=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n